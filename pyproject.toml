[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clique-scheduler"
version = "0.1.0"
description = "NVLink-clique-aware gang scheduler for GB200/GB300 NVL72 on Kubernetes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["kubernetes>=24"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
clique-scheduler = "clique_scheduler.__main__:main"

[tool.setuptools]
packages = ["clique_scheduler"]

[tool.pytest.ini_options]
pythonpath = ["."]
