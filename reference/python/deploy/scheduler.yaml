apiVersion: v1
kind: Namespace
metadata:
  name: nvlink-rack-scheduler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvlink-rack-scheduler
  namespace: nvlink-rack-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvlink-rack-scheduler
rules:
- apiGroups: [""]
  resources: [nodes, pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/binding]
  verbs: [create]
# Only needed with --defrag=on or --migrate-slices.
- apiGroups: [""]
  resources: [pods/eviction]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvlink-rack-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvlink-rack-scheduler
subjects:
- kind: ServiceAccount
  name: nvlink-rack-scheduler
  namespace: nvlink-rack-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvlink-rack-scheduler
  namespace: nvlink-rack-scheduler
spec:
  # Exactly one replica: there is no leader election, and two schedulers
  # would plan against the same free capacity.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: nvlink-rack-scheduler}
  template:
    metadata:
      labels: {app: nvlink-rack-scheduler}
    spec:
      serviceAccountName: nvlink-rack-scheduler
      containers:
      - name: scheduler
        image: nvlink-rack-scheduler:0.1.0  # docker build -t nvlink-rack-scheduler:0.1.0 .
        args:
        - --slice-size=16
        - --reserve=2
        - --defrag=dry-run  # switch to "on" once the dry-run log looks right
        resources:
          requests: {cpu: 500m, memory: 256Mi}
